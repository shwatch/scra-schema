site_name: SCRA
site_description: Semantic City Reference Architecture
site_url: https://scra-schema.org/

repo_name: shwatch/scra-schema
repo_url: https://github.com/shwatch/scra-schema

docs_dir: docs

theme:
  name: readthedocs
  locale: en

nav:
  - Home: index.md

  - Specifications:
      - Semantic Modeling Principles: specifications/semantic-modeling-principles.md

  - Semantic Models:
      - Overview: models/index.md
      - Planning:
          - ServiceCalendar: models/ServiceCalendar.md
          - DayType: models/DayType.md
          - ServiceJourney: models/ServiceJourney.md
          - JourneyPattern: models/JourneyPattern.md
          - PointInJourneyPattern: models/PointInJourneyPattern.md
      - Dated Operations:
          - OperatingDay: models/OperatingDay.md
          - DatedVehicleJourney: models/DatedVehicleJourney.md
      - Realtime Operations:
          - MonitoredVehicleJourney: models/MonitoredVehicleJourney.md
          - PassingEvent (Draft): models/PassingEvent.md
      - Physical:
          - PhysicalVehicle: models/PhysicalVehicle.md

  - Vocabulary:
      - Overview: vocab/index.md
      - PassingEvent:
          - PassingEvent: vocab/PassingEvent.md
          - monitoredVehicleJourney: vocab/monitoredVehicleJourney.md
          - stop: vocab/stop.md
          - eventType: vocab/eventType.md
          - scheduledTime: vocab/scheduledTime.md
          - predictedTime: vocab/predictedTime.md
          - observedTime: vocab/observedTime.md
          - predictionConfidence: vocab/predictionConfidence.md
          - observationTimestamp: vocab/observationTimestamp.md
          - delay: vocab/delay.md
          - minutesUntilArrival: vocab/minutesUntilArrival.md
          - referenceTime: vocab/referenceTime.md

  - JSON-LD Contexts:
      - Mobility Context: contexts/mobility.jsonld
  - Semantic Mappings:
      - GTFS Static: mappings/gtfs-static.md
      - GTFS-Realtime: mappings/gtfs-realtime.md
      - NGSI-LD: mappings/ngsi-ld.md
      - MCP: mappings/mcp.md

  - Architecture Decision Records:
      - Overview: decisions/index.md
      - ADR-0001: decisions/0001-public-transport-route.md
      - ADR-0002: decisions/0002-public-transport-locations.md
      - ADR-0003: decisions/0003-service-journey.md
      - ADR-0004: decisions/0004-realtime-vehicle-journeys.md
      - ADR-0005: decisions/0005-physical-vehicle.md
      - ADR-0006: decisions/0006-realtime-passing-times.md

markdown_extensions:
  - tables
  - toc:
      permalink: true
